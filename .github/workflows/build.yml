
name: Build TryTP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trytp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build TryTP
        working-directory: trytp-mod
        run: gradle --no-daemon --stacktrace build

      - name: Upload TryTP JAR
        uses: actions/upload-artifact@v4
        with:
          name: trytp-jar
          path: trytp-mod/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
